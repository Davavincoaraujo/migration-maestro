# Prepared project-local policy, NOT active in this managed session.
# Install only as migration-maestro/.codex/config.toml via the host's official
# project-settings mechanism. Do not place this in the global config.
# Legacy sandbox_mode in a higher config layer can override this named profile.
approval_policy = "on-request"
default_permissions = "migration-local"

[features]
network_proxy = true

[permissions.migration-local]
extends = ":workspace"
description = "Migration Maestro and existing portal only; reviewed network requests."

[permissions.migration-local.workspace_roots]
"/Users/macos/Developer/migration-maestro" = true
"/Users/macos/Developer/iibr-fed-portalbradesco" = true

[permissions.migration-local.filesystem.":workspace_roots"]
".claude" = "read"

[permissions.migration-local.network]
enabled = false

# Keep TCP disabled until a validated create-only executor and host policy can
# enforce the requested endpoints. Do not substitute unrestricted network_access.
# A runtime-specific Maestri socket must be supplied by the host, never a broad
# /tmp socket allowlist. A static path would become stale when Maestri restarts.
